name: Deploy Finance OS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run type checks, unit tests and compile for the GitHub Pages path
        run: npm run check
        env:
          GITHUB_PAGES: "true"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify production preview at GitHub Pages base path
        run: npm run test:e2e
        env:
          GITHUB_PAGES: "true"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload compiled Vite output
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy compiled app
        id: deployment
        uses: actions/deploy-pages@v5
