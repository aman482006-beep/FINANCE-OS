name: Dependency audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependency tree
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit all direct and transitive npm dependencies
        run: npm audit --audit-level=high
